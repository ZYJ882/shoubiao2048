name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build optimized Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate build signing key
        run: >-
          keytool -genkeypair -keystore app/release.keystore -storetype PKCS12
          -storepass shoubiao2048-build -keypass shoubiao2048-build
          -alias shoubiao2048 -dname "CN=shoubiao2048, OU=Wear OS, O=ZYJ882, C=CN"
          -keyalg RSA -keysize 2048 -validity 3650 -noprompt

      - name: Assemble optimized release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: shoubiao2048-build
          KEY_ALIAS: shoubiao2048
          KEY_PASSWORD: shoubiao2048-build
        run: gradle --no-daemon assembleRelease

      - name: Publish release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoubiao2048-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
