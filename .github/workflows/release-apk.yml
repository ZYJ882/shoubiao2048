name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build optimized Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run JVM unit tests
        run: gradle --no-daemon test

      - name: Restore fixed release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Assemble three optimized release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleArm64Release assembleArm32Release assembleUniversalRelease

      - name: Publish ARM64 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoubiao2048-arm64-apk
          path: app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish ARM32 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoubiao2048-arm32-apk
          path: app/build/outputs/apk/arm32/release/app-arm32-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish universal release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoubiao2048-universal-apk
          path: app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 90
